name: Build and Deploy to Render

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: bmi-calculator

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}:latest \
            -t ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}:${{ github.sha }} .

      - name: Push Latest Image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}:latest

      - name: Push Commit Image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}:${{ github.sha }}

      - name: Trigger Render Deployment
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"