<div class="container">

  <div class="card">

    <h1>BMI Calculator V2</h1>

    <div class="form-group">
      <label>Height (cm)</label>
      <input
        type="number"
        [(ngModel)]="height"
        placeholder="Enter height">
    </div>

    <div class="form-group">
      <label>Weight (kg)</label>
      <input
        type="number"
        [(ngModel)]="weight"
        placeholder="Enter weight">
    </div>

    <div class="button-group">

      <button
        class="calculate-btn"
        (click)="calculateBMI()">
        Calculate
      </button>

      <button
        class="reset-btn"
        (click)="reset()">
        Reset
      </button>

    </div>

    <div class="result" *ngIf="bmi">

      <h2>Your BMI</h2>

      <div class="value">
        {{ bmi }}
      </div>

      <div class="category">
        {{ category }}
      </div>

    </div>

  </div>

</div>
